<header><app-en-tete></app-en-tete></header>
<nav>
  <a routerLink="/" routerLinkActive="active"
     [routerLinkActiveOptions]="{ exact: true }">
    Accueil
  </a>

  <a routerLink="/cours" routerLinkActive="active" >
    Cours
  </a>

  @if (session.connecte()) {
<a routerLink="/mes-inscriptions" routerLinkActive="actif">
    Mes inscriptions
  </a>
  <button (click)="deconnecter()">
    Déconnexion ({{ session.nom() }})
  </button>

} @else {

  <a routerLink="/connexion" routerLinkActive="actif">
    Connexion
  </a>

}
</nav>
<main>
  <router-outlet></router-outlet>
</main>
<footer>
  @defer (on viewport) {

  <app-pied-page></app-pied-page>

} @placeholder {

  <div class="pied-page-placeholder">
    ...
  </div>

} @loading {

  <p>Chargement...</p>

}</footer>
